name: n8n
slug: n8n
version: 1.0.2
description: Official n8n image with Home Assistant configuration and persistent data.
url: https://github.com/making-lemonade/n8n-haos
arch:
  - aarch64
  - amd64
startup: application
boot: auto
webui: http://[HOST]:[PORT:5678]
ports:
  5678/tcp: 5678
ports_description:
  5678/tcp: n8n web interface and API
map:
  - type: data
    path: /home/node/.n8n
options:
  environment: []
schema:
  environment:
    - str
